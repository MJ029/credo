name: CI

# Required for every pull request into master. The single "CI gate" job at the bottom is the
# status check that branch protection requires; it passes only when every job above passes.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Swift)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile release build, warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors

  package:
    name: Package (installers)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the .pkg and .dmg exactly as a release does (catches a broken build.sh early)
        run: ./build.sh --no-open

  swiftlint:
    name: Code smells (SwiftLint)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SwiftLint 0.65.1 (checksum verified)
        run: |
          curl -fsSL -o portable_swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  portable_swiftlint.zip" \
            | shasum -a 256 -c -
          unzip -q portable_swiftlint.zip -d "$RUNNER_TEMP/swiftlint"
      - name: Lint (strict; existing findings are in the baseline, new ones fail)
        run: |
          "$RUNNER_TEMP/swiftlint/swiftlint" lint --strict \
            --baseline .swiftlint.baseline.json --reporter github-actions-logging

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" \
            | sha256sum -c -
          mkdir "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
      - name: Scan full git history (values are redacted in the log)
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --exit-code 1 .'

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.180.0
      - name: Scan (fails on any finding; no telemetry)
        run: |
          semgrep scan --metrics=off --error --quiet \
            --config p/default --config p/secrets --config p/swift \
            --exclude .swiftlint.baseline.json .

  workflows:
    name: Workflow security (actionlint + zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12 (checksum verified)
        run: |
          curl -fsSL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum -c -
          mkdir "$RUNNER_TEMP/actionlint" && tar -xzf actionlint.tar.gz -C "$RUNNER_TEMP/actionlint" actionlint
      - name: actionlint (workflow syntax and shell)
        run: '"$RUNNER_TEMP/actionlint/actionlint" -color'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: zizmor (injection, unpinned actions, excessive permissions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --disable-pip-version-check zizmor==1.30.1
          zizmor --no-progress .github/workflows

  personal-data:
    name: Personal data guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Block user paths, personal emails and non-noreply commit identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-personal-data.sh

  gate:
    name: CI gate
    if: always()
    needs: [build, package, swiftlint, secrets, sast, workflows, personal-data]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail unless every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed ($r)"; exit 1; }
          done
