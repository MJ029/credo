name: Release

# Push a version tag (for example v2.2.2) to start a release:
#   git tag v2.2.2 && git push origin v2.2.2
# The installers are built on a clean GitHub runner, then the "publish" job WAITS for the
# repository owner to approve it in the "release" environment before anything is published.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installers
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag is on master and matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master \
            || { echo "::error::$TAG is not on master. Merge the pull request first, then tag master."; exit 1; }
          build_version="$(grep -m1 '^VERSION=' build.sh | cut -d'"' -f2)"
          [ "$build_version" = "$version" ] \
            || { echo "::error::tag is $version but build.sh says $build_version"; exit 1; }
          grep -q "^## $version\$" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }

      - name: Build .pkg and .dmg
        run: ./build.sh --no-open

      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          mkdir dist
          mv "Credo-$version.pkg" "Credo-$version.dmg" dist/
          (cd dist && shasum -a 256 "Credo-$version.pkg" "Credo-$version.dmg" > SHA256SUMS.txt)
          # Release notes = this version's section of the changelog, without its heading.
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > dist/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: credo-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release (owner approval)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Required reviewer on this environment = nothing is published until the owner approves.
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write        # create the GitHub Release
      id-token: write        # sign the build provenance
      attestations: write    # store the build provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: credo-release
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.pkg
            dist/*.dmg

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Credo $version" --notes-file dist/notes.md \
            "dist/Credo-$version.pkg" "dist/Credo-$version.dmg" dist/SHA256SUMS.txt
